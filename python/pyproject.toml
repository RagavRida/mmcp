[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcp-core"
version = "1.0.0"
description = "One CLI that auto-routes tasks to the best AI model — Gemini, GPT, Claude, DeepSeek, Llama. No model selection needed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Raghavendra Machikatla" },
]
keywords = [
    "mmcp", "multi-model", "llm", "orchestration", "dag", "ai",
    "smart-routing", "openrouter", "claude", "gpt", "gemini",
    "deepseek", "llama", "multi-agent", "audit", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
all = [
    "mmcp-core[langchain,dev]",
]

[project.scripts]
mmcp = "mmcp_core.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["mmcp_core*", "langchain_mmcp*"]

[project.urls]
Homepage = "https://github.com/RagavRida/mmcp"
Repository = "https://github.com/RagavRida/mmcp"
Documentation = "https://github.com/RagavRida/mmcp#readme"
"Bug Tracker" = "https://github.com/RagavRida/mmcp/issues"
"MMCP Cloud" = "https://mmcp.up.railway.app"
